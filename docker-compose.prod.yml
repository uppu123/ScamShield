services:
  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      GUNICORN_WORKERS: "1"
      MONGO_URI: ${MONGO_URI:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TESSERACT_CMD: tesseract
      PORT: "5000"

  frontend:
    restart: unless-stopped

  nginx:
    restart: unless-stopped

volumes:
  nginx-certs:
