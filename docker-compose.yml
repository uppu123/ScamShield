services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI:-}
      TESSERACT_CMD: tesseract
      PORT: "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r frontend/requirements.txt &&
             streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
